name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: bash scripts/setup.sh
      - run: uv pip install --python .venv/bin/python -r requirements-dev.txt
      - run: CUDA_VISIBLE_DEVICES=-1 .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m ruff check phonon_echo tests
  ollama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false
      - run: bash scripts/build-ollama.sh
      - run: go test -p 4 ./manifest ./create ./mlxrunner ./server
        working-directory: .cache/ollama-source
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          OLLAMA_MODELS: '${{ runner.temp }}/ollama-test-models'
